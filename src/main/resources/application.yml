# ---------------------------------------------------------------------------
# AgentREST - shared configuration (all profiles)
# Profile-specific files: application-dev.yml (default), application-prod.yml
# No secrets live in this repository. See README "Configuration".
# ---------------------------------------------------------------------------
spring:
  application:
    name: agentrest
  profiles:
    # `./mvnw spring-boot:run` works with zero setup (H2 in-memory + demo data)
    default: dev
  threads:
    virtual:
      enabled: true
  web:
    # Error/validation messages default to English; clients may send Accept-Language (e.g. zh-CN).
    locale: en
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
  ai:
    mcp:
      server:
        name: agentrest
        version: '@project.version@'
        type: SYNC
        protocol: STREAMABLE
        instructions: >-
          AgentREST exposes a small article/knowledge-base API. Use searchArticles to find
          articles, getArticle to read one in full, and createArticleDraft to propose a new
          draft (drafts are never published automatically; a human publishes them).
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp

server:
  error:
    include-stacktrace: never
    include-message: never

agentrest:
  security:
    jwt:
      # REQUIRED outside dev: at least 32 bytes. Set via env JWT_SECRET.
      secret: ${JWT_SECRET:}
      issuer: agentrest
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    cors:
      # Comma-separated list, e.g. https://app.example.com. Empty = CORS disabled.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # Public self-registration (POST /api/auth/register). Off by default.
    registration-enabled: false
    login-rate-limit:
      # Max login/register/refresh attempts per client IP per window
      max-attempts: 10
      window: 1m
    # Optional: create the first admin on an empty database (prod bootstrap).
    # AGENTREST_ADMIN_* (the pre-2.1 LAZYREST_ADMIN_* names still work as a fallback).
    bootstrap-admin:
      username: ${AGENTREST_ADMIN_USERNAME:${LAZYREST_ADMIN_USERNAME:}}
      email: ${AGENTREST_ADMIN_EMAIL:${LAZYREST_ADMIN_EMAIL:}}
      password: ${AGENTREST_ADMIN_PASSWORD:${LAZYREST_ADMIN_PASSWORD:}}
  mcp:
    # Write tools (createArticleDraft) are only registered when this is true.
    # Even then, the caller needs the `mcp:write` permission and a non read-only API key.
    write-tools-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
  info:
    java:
      enabled: true
    os:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
  paths-to-match: /api/**

logging:
  pattern:
    level: '%5p [%X{requestId:-}]'
