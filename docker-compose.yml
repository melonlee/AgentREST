# AgentREST + MySQL 8.4 with the prod profile.
#   cp .env.example .env   # then fill in the secrets
#   docker compose up --build
# Secrets come from .env (git-ignored); compose refuses to start if a required one is missing.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentrest
      MYSQL_USER: agentrest
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    image: agentrest:2.2.0
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/agentrest
      DB_USERNAME: agentrest
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      AGENTREST_ADMIN_USERNAME: ${AGENTREST_ADMIN_USERNAME:-admin}
      AGENTREST_ADMIN_EMAIL: ${AGENTREST_ADMIN_EMAIL:-admin@example.com}
      AGENTREST_ADMIN_PASSWORD: ${AGENTREST_ADMIN_PASSWORD:?Set AGENTREST_ADMIN_PASSWORD in .env (>= 12 chars)}
      MCP_WRITE_TOOLS_ENABLED: ${MCP_WRITE_TOOLS_ENABLED:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

volumes:
  mysql-data:
