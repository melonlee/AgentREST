<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.canvas { width: 1080px; height: 1440px; padding: 72px 76px; }
.canvas::after { width: 1200px; height: 1200px; right: -520px; top: -420px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.top img { height: 56px; }
.top span { font-size: 22px; color: var(--muted); letter-spacing: .08em; }
h1 { margin-top: 84px; font-size: 76px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
p.sub { margin-top: 30px; font-size: 29px; line-height: 1.6; color: #C4D0CA; }
p.sub b { color: var(--paper); }
.peek { position: absolute; left: 76px; right: 76px; bottom: 236px; }
.peek > .beaver { right: 26px; width: 320px; }
.peek > .tag-note { position: absolute; bottom: calc(100% + 34px); left: 0; font-family: var(--mono); font-size: 20px; line-height: 1.8; color: var(--muted); }
.peek > .tag-note b { color: var(--mint); font-weight: 500; }
.term pre { font-size: 19px; line-height: 1.75; padding: 22px 26px 26px; }
.term .card-head { font-size: 15px; }
.canvas > footer { left: 76px; right: 76px; bottom: 64px; display: flex; justify-content: space-between; align-items: flex-end; }
.canvas > footer .chips { max-width: 600px; gap: 10px; }
.canvas > footer .chip { font-family: var(--sans); font-size: 19px; padding: 8px 14px; color: #C4D0CA; }
.canvas > footer .r { text-align: right; font-family: var(--mono); font-size: 20px; color: var(--muted); line-height: 1.7; }
.canvas > footer .r b { color: var(--paper); font-weight: 500; }
</style></head><body>
<div class="canvas">
  <div class="top"><img src="../agentrest-logo-dark.svg"><span>Spring Boot · 开源脚手架</span></div>
  <h1>你负责偷懒，<br><span class="mint">河狸负责把接口接给 AI。</span></h1>
  <p class="sub">一个<b>诚实的、生产级形态</b>的 Spring Boot REST 脚手架：<br>接口同时是 <b>MCP 工具</b>，同样的权限，同样的审计。</p>
  <div class="peek">
    <div class="tag-note">认证 · RBAC · 所有权校验<br><b>REST + MCP 同一条审计链</b><br>Agent 写操作三重门控</div>
    <img class="beaver" src="../agentrest-beaver.svg" alt="">
    <!--include:term-mcp-->
  </div>
  <footer>
    <div class="chips"><span class="chip">Spring Boot 4.1</span><span class="chip">Java 21</span><span class="chip">Spring AI MCP</span><span class="chip">H2 零配置启动</span><span class="chip">MySQL / PostgreSQL</span><span class="chip">70 个测试</span></div>
    <div class="r">Apache-2.0 开源<br><b>github.com/melonlee/AgentREST</b></div>
  </footer>
</div></body></html>
