<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
.canvas { width: 1200px; height: 630px; padding: 60px 64px; }
.canvas::after { right: -260px; top: -300px; }
.logo { height: 44px; display: block; }
h1 { margin-top: 56px; font-size: 54px; line-height: 1.08; letter-spacing: -.03em; font-weight: 750; max-width: 620px; }
p.sub { margin-top: 20px; font-size: 19px; line-height: 1.5; color: var(--muted); max-width: 560px; }
.beaver { position: absolute; right: 52px; bottom: 46px; width: 318px; }
.say { position: absolute; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 14px; color: var(--muted); background: rgba(17,25,22,.92); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; box-shadow: 0 16px 40px rgba(0,0,0,.4); }
.say b { color: var(--paper); font-weight: 500; }

</style></head><body>
<div class="canvas">
  <img class="logo" src="../agentrest-logo-dark.svg">
  <h1>Let AI agents call your business API — <span class="mint">safely.</span></h1>
  <p class="sub">Spring Boot 4.1 REST starter with a built-in MCP server. Agents use the same service layer, permissions and audit log as your REST clients.</p>
  <img class="beaver" src="../agentrest-beaver.svg" alt="">
  <div class="say" style="left:668px;top:200px"><span class="tag rest">REST</span><b>Bearer JWT</b></div>
  <div class="say" style="left:640px;top:262px"><span class="tag mcp">MCP</span><b>X-API-Key</b></div>
  <footer>github.com/melonlee/AgentREST · Apache-2.0 · Java 21</footer>
</div></body></html>
